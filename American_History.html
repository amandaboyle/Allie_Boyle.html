<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American History Course - Neon Edition</title>
    <style>
        :root {
            --neon-bg: #0d0221;
            --neon-border: #ff00ff;
            --neon-glow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            --neon-cyan: #00f2ff;
            --neon-text: #fff;
        }
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: var(--neon-bg); 
            color: var(--neon-text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        header { 
            border-bottom: 4px solid var(--neon-border);
            padding: 2rem; 
            text-align: center;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-border);
        }
        .container { display: flex; flex: 1; max-width: 1200px; margin: auto; width: 100%; gap: 20px; padding: 20px; }
        nav { width: 300px; padding: 20px; }
        main { flex: 1; padding: 40px; border: 2px solid var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); border-radius: 15px; }
        .unit-btn { 
            display: block; width: 100%; padding: 15px; margin-bottom: 10px; 
            background: transparent; color: var(--neon-cyan); 
            border: 1px solid var(--neon-cyan); border-radius: 5px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .unit-btn:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 20px var(--neon-cyan); }
        .unit-btn.active { background: var(--neon-border); color: white; border-color: white; box-shadow: var(--neon-glow); }
        h2 { color: var(--neon-border); text-shadow: 0 0 5px var(--neon-border); }
        .link-item { color: var(--neon-cyan); font-weight: bold; text-decoration: none; display: block; margin: 10px 0; }
        .link-item:hover { text-shadow: 0 0 10px var(--neon-cyan); }
    </style>
</head>
<body>

<header>
    <h1>AMERICAN HISTORY: 12 UNITS</h1>
</header>

<div class="container">
    <nav id="sidebar">
        <!-- Units will be injected here -->
    </nav>
    <main id="content">
        <h2>SELECT A UNIT</h2>
        <p>USE THE SIDEBAR TO EXPLORE THE TIMELINE.</p>
    </main>
</div>

<script>
    const units = [
        { 
            id: 1, 
            title: "The First Americans", 
            desc: "Migration, early indigenous cultures, and environmental adaptations.", 
            link: "https://www.nps.gov/subjects/archeology/first-americans.htm", 
            extraLink: "American_History_Unit1.html", 
            extraLabel: "Unit 1 Interactive App", 
            videos: [
                { url: "https://www.youtube.com/watch?v=fyZNYdZynb0", title: "The Ice Age" },
                { url: "https://www.youtube.com/watch?v=Pg0Z3LappEM", title: "Geography of the Ice Age" },
                { url: "https://www.youtube.com/watch?v=PQ-sWeOqAS0&t=46s", title: "What America was like during the Ice Age" },
                { url: "https://www.youtube.com/watch?v=gjvW38Oq4t8", title: "How Glaciers Carved North America" },
                { url: "https://www.youtube.com/watch?v=7gwSNN-z5sM", title: "Beringia Land Bridge" }
            ]
        },
        { id: 2, title: "Exploration and colonization", desc: "European voyages, the Columbian Exchange, and early interactions.", link: "https://www.loc.gov/collections/exploring-the-early-americas/", extraLink: "American_History_Unit2.html", extraLabel: "View Unit 2 Document" },
        { id: 3, title: "Colonial America", desc: "Regional differences in New England, Middle, and Southern colonies.", link: "https://www.ushistory.org/us/2.asp", extraLink: "American_History_Unit3.html", extraLabel: "View Unit 3 Document" },
        { id: 4, title: "The Road to Revolution", desc: "Tensions, French & Indian War, and the path to independence.", link: "https://www.history.com/topics/american-revolution/road-to-revolution", extraLink: "American_History_Unit4.html", extraLabel: "View Unit 4 Document" },
        { id: 5, title: "The American Revolution", desc: "The conflict, key battles, and the creation of a new nation.", link: "https://www.nps.gov/revwar/index.html", extraLink: "American_History_Unit5.html", extraLabel: "View Unit 5 Document" },
        { id: 6, title: "Creating a New Nation", desc: "Drafting the Constitution and establishing government.", link: "https://www.archives.gov/founding-docs/constitution", extraLink: "American_History_Unit6.html", extraLabel: "View Unit 6 Document" },
        { id: 7, title: "The Early Republic", desc: "The first presidencies and the Louisiana Purchase.", link: "https://www.mountvernon.org/", extraLink: "American_History_Unit7.html", extraLabel: "View Unit 7 Document" },
        { id: 8, title: "Growth and Expansion", desc: "Manifest Destiny and westward movement.", link: "https://www.loc.gov/exhibits/odyssey/archive.html", extraLink: "American_History_Unit8.html", extraLabel: "View Unit 8 Document" },
        { id: 9, title: "The North and South", desc: "Economic and social divide, slavery, and industrialization.", link: "https://www.history.com/topics/19th-century/north-and-south", extraLink: "American_History_Unit9.html", extraLabel: "View Unit9 Document" },
        { id: 10, title: "Reform Movements", desc: "Abolitionism, women's suffrage, and temperance.", link: "https://www.gilderlehrman.org/", extraLink: "American_History_Unit10.html", extraLabel: "View Unit 10 Document" },
        { id: 11, title: "Sectionalism and the Civil War", desc: "Crisis of the Union and the war itself.", link: "https://www.battlefields.org/learn/civil-war", extraLink: "American_History_Unit11.html", extraLabel: "View Unit 11 Document" },
        { id: 12, title: "Reconstruction", desc: "Efforts to rebuild the South and rights of freedmen.", link: "https://www.history.com/topics/american-civil-war/reconstruction", extraLink: "American_History_Unit12.html", extraLabel: "View Unit 12 Document" }
    ];

    const sidebar = document.getElementById('sidebar');
    const content = document.getElementById('content');

    units.forEach(unit => {
        const btn = document.createElement('button');
        btn.className = 'unit-btn';
        btn.textContent = `Unit ${unit.id}: ${unit.title}`;
        btn.onclick = () => {
            document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            let htmlContent = `
                <h2>UNIT ${unit.id}: ${unit.title.toUpperCase()}</h2>
                <p>${unit.desc.toUpperCase()}</p>
                <div class="link-group">
            `;
            
            if (unit.id !== 1) {
                htmlContent += `<a href="${unit.link}" target="_blank" class="link-item">> EXPLORE UNIT</a>`;
            }
            
            if (unit.extraLink) {
                htmlContent += `<a href="${unit.extraLink}" target="_blank" class="link-item">> ${unit.extraLabel.toUpperCase()}</a>`;
            }

            if (unit.videos) {
                unit.videos.forEach(video => {
                    htmlContent += `<a href="${video.url}" target="_blank" class="link-item">> ${video.title.toUpperCase()}</a>`;
                });
            }
            
            htmlContent += `</div>`;
            content.innerHTML = htmlContent;
        };
        sidebar.appendChild(btn);
    });
</script>

</body>
</html>
