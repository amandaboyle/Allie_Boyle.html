<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Your Learning Style! 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="bg-indigo-50 min-h-screen p-4 md:p-8 font-sans">

    <div id="app" class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border-t-8 border-indigo-500">
        <div class="p-6 md:p-10" id="quiz-container">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 mb-2">My Learning Style 🧩</h1>
            <p class="text-gray-500 mb-6 font-medium">Answer honestly to see how your brain likes to learn!</p>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div id="question-area" class="fade-in">
                <!-- Question injected here -->
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "When learning something new, I prefer to:", a: { V: "🎨 See pictures, charts, or diagrams", A: "🎧 Listen to someone explain it", K: "🖐️ Get hands-on with it" } },
            { q: "If I need to remember a list of things, I usually:", a: { V: "📝 Write it down in a notebook", A: "🗣️ Say it out loud to myself", K: "🏃 Walk around while I study" } },
            { q: "I find it easiest to follow directions when:", a: { V: "👁️ They are written in a guide", A: "👂 Someone tells me what to do", K: "🧩 I try it out while someone shows me" } },
            { q: "When I am bored, I like to:", a: { V: "📖 Read a book or draw", A: "💬 Talk to my friends", K: "⚽ Play a game or move around" } },
            { q: "I learn best in class when:", a: { V: "📽️ The teacher uses slides/videos", A: "👥 We have group discussions", K: "🔬 We do a science lab or project" } }
        ];

        let currentQ = 0;
        const scores = { V: 0, A: 0, K: 0 };

        function showQuestion() {
            const container = document.getElementById('question-area');
            const progressBar = document.getElementById('progress-bar');
            const q = questions[currentQ];
            
            progressBar.style.width = `${(currentQ / questions.length) * 100}%`;
            
            container.innerHTML = `
                <p class="text-xl font-bold text-gray-800 mb-6">${currentQ + 1}. ${q.q}</p>
                <div class="space-y-4">
                    ${Object.entries(q.a).map(([key, val]) => `
                        <button onclick="record('${key}')" class="w-full flex items-center p-4 rounded-xl bg-gray-50 hover:bg-indigo-50 border-2 border-gray-100 hover:border-indigo-300 transition-all transform hover:-translate-y-1 font-semibold text-gray-700 hover:text-indigo-800 text-left">
                            ${val}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function record(type) {
            scores[type]++;
            currentQ++;
            if (currentQ < questions.length) showQuestion();
            else showResults();
        }

        function showResults() {
            const winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            const titles = { 
                V: "Visual Learner 🎨", 
                A: "Auditory Learner 🎧", 
                K: "Kinesthetic Learner 🏃" 
            };
            const desc = {
                V: "You are a master of visualization! Your brain loves color-coded notes, flashcards, and diagrams. Try creating mind maps to study.",
                A: "You learn through your ears! You likely remember lectures, enjoy discussions, and could benefit from recording notes and playing them back.",
                K: "You learn by doing! Sitting still is hard, but you thrive when you can physically manipulate objects or move while learning. Try role-playing!"
            };

            document.getElementById('quiz-container').innerHTML = `
                <div class="text-center fade-in">
                    <div class="text-6xl mb-6">🎉</div>
                    <h2 class="text-2xl font-bold text-indigo-900 mb-2">You are a:</h2>
                    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-6">${titles[winner]}</h1>
                    <p class="text-lg text-gray-600 mb-8 leading-relaxed">${desc[winner]}</p>
                    <button onclick="location.reload()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-bold text-lg hover:shadow-lg transition-transform hover:-translate-y-1">
                        Start Over!
                    </button>
                </div>
            `;
        }

        showQuestion();
    </script>
</body>
</html>
