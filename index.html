<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allie Boyle's Neon Platform</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-purple: #9d00ff;
            --bg-dark: #0d0221;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0033 0%, #0d0221 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: white;
        }

        .card {
            background: rgba(13, 2, 33, 0.8);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 0 20px var(--neon-purple), 0 0 40px var(--neon-pink);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 2px solid var(--neon-cyan);
        }

        h1 { 
            color: var(--neon-cyan); 
            font-size: 2rem; 
            margin-bottom: 0.5rem; 
            text-shadow: 0 0 10px var(--neon-cyan);
            text-transform: uppercase;
        }

        .position { 
            color: var(--neon-pink); 
            font-weight: bold; 
            font-size: 1rem; 
            margin-bottom: 2rem; 
            letter-spacing: 2px;
        }
        
        .btn-container { display: flex; flex-direction: column; gap: 15px; }

        .btn {
            background: transparent;
            color: var(--neon-cyan);
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 700;
            border: 2px solid var(--neon-cyan);
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: inset 0 0 5px var(--neon-cyan), 0 0 5px var(--neon-cyan);
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            text-shadow: none;
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: scale(1.02);
        }

        #greeting { font-size: 0.8rem; color: #fff; margin-bottom: 1.5rem; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Allie Boyle</h1>
        <p class="position">Student Extraordinaire</p>

        <p id="greeting">READY TO POWER UP? ⚡</p>

        <div class="btn-container">
            <a href="learning_style.html" class="btn">Learning Styles</a>
            <a href="American_History.html" class="btn">American History</a>
            <a href="Bible.html" class="btn">Bible</a>
            <a href="https://www.biblegateway.com/passage/?search=Psalms+119%3A11&version=NIV" target="_blank" rel="noopener noreferrer" class="btn">Psalms 119:11</a>
            <a href="Math.html" class="btn">Math</a>
            <a href="IPC.html" class="btn">Integrated Physics & Chemistry</a>
            <a href="Grammar.html" class="btn">Language Arts</a>
        </div>
    </div>

</body>
</html>
